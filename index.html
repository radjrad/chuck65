<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dad at 65: The Expedition</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1626">
<style>
/* ==================================================================
   DAD AT 65: THE EXPEDITION
   Single-file, offline, TV-friendly. All text lives in the CONTENT
   section of the script below. Colors per chapter live in the
   body[data-theme=...] blocks right here. The PHONE block at the end
   of this stylesheet restacks every screen for a portrait phone.
   ================================================================== */

:root{
  /* 1rem scales with the viewport: 28.8px at 1920x1080 (1.5vw), so every screen keeps the same proportions on any 16:9/16:10 display */
  --fs: max(12px, min(1.5vw, 2.7vh));
  --bg:#0d1b2e; --bg2:#22304d; --accent:#ffd98a; --accent2:#3b4a6b;
  --ink:#ffffff; --card:rgba(12,18,32,.82);
  --btn:#ffd98a; --btnText:#2b1d0e;
  --hud-h: 2.6rem;
}
body[data-theme=title]   { --bg:#0b1626; --bg2:#22304d; --accent:#ffd98a; --accent2:#3b4a6b; --btn:#ffd98a; --btnText:#2b1d0e; --card:rgba(10,16,30,.78); }
body[data-theme=maryland]{ --bg:#12301c; --bg2:#2e5a3a; --accent:#f2c14e; --accent2:#5a3d1e; --btn:#f2c14e; --btnText:#1a2b12; --card:rgba(14,36,22,.86); }
body[data-theme=michigan]{ --bg:#061532; --bg2:#1d3f73; --accent:#FFCB05; --accent2:#00274C; --btn:#FFCB05; --btnText:#00274C; --card:rgba(0,39,76,.84); }
body[data-theme=navy]    { --bg:#0d1117; --bg2:#232b36; --accent:#f5a623; --accent2:#3a4656; --btn:#f5a623; --btnText:#1a1409; --card:rgba(10,14,20,.86); }
body[data-theme=clemson] { --bg:#1a0c33; --bg2:#522D80; --accent:#F56600; --accent2:#522D80; --btn:#F56600; --btnText:#1d0f2e; --card:rgba(38,18,66,.86); }
body[data-theme=desert]  { --bg:#2b1440; --bg2:#c1553b; --accent:#F2A93B; --accent2:#8f3d2a; --btn:#F2A93B; --btnText:#3a1a10; --card:rgba(58,26,16,.84); }
body[data-theme=friday]  { --bg:#0a0810; --bg2:#2b2b2b; --accent:#e8b04b; --accent2:#97233F; --btn:#97233F; --btnText:#ffffff; --pillText:#2b0a12; --card:rgba(22,12,16,.88); }
body[data-theme=vietnam] { --bg:#0f2f31; --bg2:#245a57; --accent:#f2b134; --accent2:#c62828; --btn:#f2b134; --btnText:#2b1a0a; --card:rgba(10,40,42,.88); }
body[data-theme=summit]  { --bg:#0d1b2e; --bg2:#f7b267; --accent:#ffd98a; --accent2:#3b4a6b; --btn:#ffd98a; --btnText:#2b1d0e; --card:rgba(20,25,40,.82); }

*{box-sizing:border-box}
html{font-size:var(--fs)}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-weight:600; line-height:1.3;
  transition:background .4s;
}
body.idle, body.idle *{cursor:none !important}
[hidden]{display:none !important}
button{font-family:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
body{-webkit-text-size-adjust:100%}
b,strong{font-weight:800}

#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- HUD: chapter label + trail map + sound toggle ---------- */
#hud{
  height:var(--hud-h); flex:0 0 var(--hud-h); z-index:20;
  display:flex; align-items:center; gap:1rem; padding:0 9rem 0 1.2rem;
  background:linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0));
  position:relative;
}
#hud-chapter{font-size:.95rem; font-weight:800; letter-spacing:.02em; white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.6)}
#trail{height:2.3rem; width:auto; margin-left:auto}
#trail .node{fill:rgba(255,255,255,.25); stroke:rgba(255,255,255,.6); stroke-width:3}
#trail .node.done{fill:var(--accent); stroke:#fff}
#trail .node.now{fill:var(--accent); stroke:#fff; animation:pulse 1.2s ease-in-out infinite}
#trail .lbl{fill:#fff; font-size:22px; font-weight:800; text-anchor:middle}
#trail .lbl.done, #trail .lbl.now{fill:var(--btnText)}
#trail .path{fill:none; stroke:rgba(255,255,255,.5); stroke-width:5; stroke-dasharray:10 12}
#trail .path.done{stroke:var(--accent); stroke-dasharray:none}
#trail .flag{fill:var(--accent)}
#sound{position:absolute; top:.55rem; right:1.2rem; z-index:25}
body.closing #sound{display:none}
.tiny{
  font-size:.7rem; font-weight:700; padding:.25rem .6rem; border-radius:.4rem;
  background:rgba(0,0,0,.45); color:#fff; border:2px solid rgba(255,255,255,.5); cursor:pointer;
}
@media (hover:hover){ .tiny:hover{background:rgba(255,255,255,.2)} }

/* ---------- Stage + screens ---------- */
#stage{position:relative; flex:1 1 auto; min-height:0}
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; transition:opacity .4s ease;
}
.screen.in{opacity:1}
.screen.out{opacity:0; pointer-events:none}

.scene{position:absolute; inset:calc(-1 * var(--hud-h)) 0 0 0; z-index:0; overflow:hidden; background:var(--bg)}
.scene .layer{position:absolute; inset:-3%; will-change:transform; transition:transform .25s ease-out}
.scene .layer svg{width:100%; height:100%; display:block}
.scene.dim .layer{filter:brightness(.42) saturate(.85)}
.scene.soft .layer{filter:brightness(.8)}
body[data-theme=desert] .scene.dim .layer{filter:brightness(.58) saturate(.95)}
.scene .shade{position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,.72))}
.photo-scene img.kb{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:kb 22s ease-in-out infinite alternate}

.content{position:relative; z-index:1; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem 3rem .6rem; gap:.7rem}
.screen[data-screen=title] .content{margin-left:36vw; padding-right:2rem}
.screen[data-screen=title] .lead{max-width:32rem}
.content.center{text-align:center}
.actions{position:relative; z-index:1; flex:0 0 auto; display:flex; justify-content:center; align-items:center; gap:1rem; padding:.6rem 3rem 1.3rem}
.hints{position:absolute; left:1.2rem; bottom:.8rem; z-index:2; font-size:.62rem; font-weight:700; opacity:.85; text-shadow:0 2px 4px #000}

/* ---------- Type ---------- */
.do{
  position:absolute; top:.5rem; left:50%; transform:translateX(-50%); z-index:2; white-space:nowrap;
  font-size:1.05rem; font-weight:800; letter-spacing:.01em;
  background:var(--accent); color:var(--pillText, var(--btnText)); padding:.25rem 1rem; border-radius:2rem;
  box-shadow:0 .2rem .6rem rgba(0,0,0,.35);
}
.kicker{font-size:1rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; opacity:.92}
h1.giant{font-size:4.2rem; line-height:1; margin:.2rem 0 0; letter-spacing:.02em; text-shadow:0 .25rem 0 rgba(0,0,0,.45), 0 .6rem 1.4rem rgba(0,0,0,.5)}
.sub{font-size:2rem; font-weight:900; letter-spacing:.35em; color:var(--accent); text-shadow:0 .2rem .6rem rgba(0,0,0,.6)}
h2{font-size:2rem; line-height:1.1; margin:0; font-weight:900; text-shadow:0 .15rem .5rem rgba(0,0,0,.5)}
h2.q{text-align:center; max-width:52rem}
p{margin:0}
.lead{font-size:1.25rem; max-width:44rem; text-shadow:0 2px 8px rgba(0,0,0,.8)}

.card{background:var(--card); border:.14rem solid rgba(255,255,255,.18); border-radius:1rem; padding:1rem 1.4rem; box-shadow:0 .6rem 1.6rem rgba(0,0,0,.45)}
.card p{font-size:1.1rem; line-height:1.35}
.card.narration{max-width:40rem}
.card.narration h2{margin:.15rem 0 .5rem}
.row{display:flex; align-items:center; justify-content:center; gap:2rem; width:100%}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.6rem;
  min-height:3rem; padding:.5rem 1.6rem; font-size:1.15rem; font-weight:800; line-height:1.15;
  border:0; border-radius:.7rem; background:var(--btn); color:var(--btnText);
  box-shadow:0 .28rem 0 rgba(0,0,0,.4), 0 .6rem 1.2rem rgba(0,0,0,.35); cursor:pointer;
  transition:transform .12s, filter .12s, box-shadow .12s, opacity .3s; text-align:center;
}
.btn.big{min-height:3.6rem; font-size:1.35rem; padding:.6rem 2.4rem}
.btn.hi{filter:brightness(1.12); transform:translateY(-.1rem); outline:.26rem solid #fff; outline-offset:.14rem}
@media (hover:hover){ .btn:hover{filter:brightness(1.12); transform:translateY(-.1rem); outline:.26rem solid #fff; outline-offset:.14rem} }
@media (hover:none){ .btn.hi{filter:none; transform:none; outline:none} .can.hi .face{outline:none} }
.btn:active{transform:translateY(.12rem); box-shadow:0 .1rem 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45; cursor:default; filter:none; transform:none; outline:none}
.btn.continue{background:#fff; color:#111}
.btn.ghostbtn{background:rgba(0,0,0,.5); color:#fff; border:.14rem solid rgba(255,255,255,.6)}

.opts{display:grid; gap:.9rem; width:min(62rem, 100%); margin-top:.2rem}
.opts.n2, .opts.n3{grid-template-columns:1fr}
.opts.n4{grid-template-columns:1fr 1fr}
.opts.n5{grid-template-columns:1fr 1fr 1fr; width:min(72rem,100%)}
.opt{justify-content:flex-start; text-align:left; min-height:3.2rem; padding:.5rem 1rem .5rem .6rem; width:100%}
.opt .num{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; width:2rem; height:2rem; border-radius:50%; background:var(--btnText); color:var(--btn); font-size:1.05rem; font-weight:900}
.opt .lbl{flex:1 1 auto}
.opt.wrong{opacity:.35; text-decoration:line-through; animation:shake .45s}
.reaction{max-width:52rem; text-align:center}
.reaction .picked{font-weight:900; text-transform:none; letter-spacing:0}
.reaction p{font-size:1.35rem; margin-top:.4rem}
.reaction.wrongbox{border-color:var(--accent)}

/* ---------- Polaroids / photos ---------- */
.polaroid{
  flex:0 0 auto; margin:0; padding:.55rem .55rem .9rem; background:#fbf7ef; color:#2b2b2b;
  transform:rotate(var(--rot, -3deg)); box-shadow:0 .8rem 1.8rem rgba(0,0,0,.55); border-radius:.15rem;
  text-align:center;
}
.polaroid img{display:block; max-height:46vh; max-width:28vw; width:auto; height:auto; object-fit:contain; background:#111}
.polaroid figcaption{width:min-content; min-width:100%; font-size:1rem; line-height:1.25; font-weight:700; padding-top:.5rem; font-style:italic}
.polaroid.sm img{max-height:30vh; max-width:16vw}
.photos{display:flex; align-items:center; gap:1.2rem}

/* ---------- Mini-interactions ---------- */
.content.mini{gap:.5rem}
.note{font-size:1.2rem; font-weight:800; min-height:1.6rem; text-align:center; text-shadow:0 2px 6px rgba(0,0,0,.7); max-width:56rem}
.note.big{font-size:2rem; color:var(--accent)}
.playfield{position:relative; width:min(70rem, 100%); height:58vh; display:flex; align-items:center; justify-content:center}
.playfield > svg{width:100%; height:100%}

/* Beer-can matching game (Maryland) */
.canswrap{display:flex; align-items:center; gap:2rem; width:100%; height:100%; justify-content:center}
.cans{--canh:12.5vh; display:grid; grid-template-columns:repeat(4, 7.2rem); grid-template-rows:repeat(4, var(--canh)); gap:.55rem 1rem; padding:.6rem 1.2rem; border-radius:.6rem;
  background:repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--canh) + .55rem - .5rem), #5a3d1e calc(var(--canh) + .55rem - .5rem), #3b2712 calc(var(--canh) + .55rem)); box-shadow:0 .8rem 2rem rgba(0,0,0,.5)}
.can{position:relative; border:0; background:transparent; padding:0; cursor:pointer; perspective:600px}
.can .inner{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .35s}
.can.up .inner{transform:rotateY(180deg)}
.can .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:.9rem .9rem .7rem .7rem; display:flex; align-items:center; justify-content:center; font-weight:900; text-align:center; padding:.3rem}
.can .back{background:linear-gradient(to right,#8d949c,#d9dde2 45%,#8d949c); color:#2b2b2b; font-size:1.8rem; border:.14rem solid #4d555c}
.can .back::before, .can .front::before{content:""; position:absolute; left:8%; right:8%; top:.25rem; height:.5rem; border-radius:50%; background:rgba(255,255,255,.55)}
.can .front{transform:rotateY(180deg); background:linear-gradient(to right, rgba(0,0,0,.25), transparent 30%, transparent 70%, rgba(0,0,0,.25)), var(--c); color:#fff; font-size:1rem; line-height:1.1; text-shadow:0 1px 3px rgba(0,0,0,.7); border:.14rem solid rgba(0,0,0,.35)}
.can.hi .face{outline:.26rem solid #fff; outline-offset:.1rem}
.can.matched .front{box-shadow:0 0 1rem .2rem var(--accent)}
.can.matched{animation:pop .4s}
.cansinfo{display:flex; flex-direction:column; align-items:center; gap:.6rem; min-width:16rem}
.cansinfo .timer{font-size:2.6rem; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1}
.cansinfo .best{font-size:1rem; font-weight:800}
.cansinfo .pairs{font-size:1.1rem}

/* Big House */
.section{fill:#5b6675; stroke:#0b1a2e; stroke-width:3; transition:fill .4s; cursor:pointer}
@media (hover:hover){ .section:hover{fill:#7c8899} }
.section.full{fill:#00274C; cursor:default}
.fan{opacity:0; transform-box:fill-box; transform-origin:center; pointer-events:none}
.fan.show{opacity:1; animation:pop .5s ease-out}
.bighouse.roar .fan{animation:bounce .6s ease-in-out}
.roar-text{font-size:110px; font-weight:900; fill:#FFCB05; stroke:#00274C; stroke-width:6; paint-order:stroke; text-anchor:middle; opacity:0; pointer-events:none}
.roar-text.show{opacity:1; animation:pop .6s ease-out}

/* Reactor sequence (no hints) */
.reactor{display:grid; grid-template-columns:1.3fr 1fr; gap:2rem; width:100%; height:100%; align-items:center}
.reactor.bzzt{animation:bzzt .5s}
.seq{display:flex; flex-direction:column; gap:.8rem; align-items:center}
.seq .opts{width:100%}
.lamps{display:flex; gap:.7rem}
.lamp{width:1.4rem; height:1.4rem; border-radius:50%; background:#3a3a3a; border:.12rem solid #666; transition:background .3s, box-shadow .3s}
.lamp.on{background:#8cff5a; box-shadow:0 0 .6rem #8cff5a}
.gaugebox{display:flex; flex-direction:column; align-items:center; gap:.4rem}
.gaugebox svg{width:22rem; height:auto}
.needle{transform-origin:200px 200px; transform:rotate(-120deg); transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.readout{font-size:1.4rem; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums}
.banner{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-6deg) scale(2.5); opacity:0; font-size:3.2rem; font-weight:900; color:#fff; background:var(--accent2); border:.3rem solid var(--accent); padding:.4rem 1.6rem; border-radius:.6rem; letter-spacing:.08em; box-shadow:0 1rem 2rem rgba(0,0,0,.6); pointer-events:none; visibility:hidden}
.banner.show{visibility:visible; animation:stamp .6s ease-out forwards}

/* Org chart */
.org{position:relative; width:100%; height:100%}
.org svg{position:absolute; inset:0; width:100%; height:100%}
.org line{stroke:var(--accent); stroke-width:5; stroke-linecap:round; opacity:0; transition:opacity .4s}
.org line.show{opacity:1}
.org line.dotted{stroke-dasharray:14 12}
.obox{position:absolute; transform:translate(-50%,-50%) scale(.2); opacity:0; background:var(--card); border:.16rem solid var(--accent); border-radius:.8rem; padding:.5rem .9rem; text-align:center; min-width:11rem; transition:transform .45s cubic-bezier(.3,1.4,.5,1), opacity .3s; box-shadow:0 .6rem 1.4rem rgba(0,0,0,.5)}
.obox.show{transform:translate(-50%,-50%) scale(1); opacity:1}
.obox .t{font-size:1.15rem; font-weight:900}
.obox .s{font-size:.95rem; opacity:.9}
.obox.top{background:var(--accent); color:var(--btnText); border-color:#fff; min-width:14rem}
.obox.top .t{font-size:1.5rem}
.obox.dotted{border-style:dashed; background:rgba(0,0,0,.55)}

/* Cactus fight */
.arena{position:relative; width:100%; height:100%; overflow:hidden; border-radius:.8rem; background:linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.35) 75%, #5e2418 75%, #3a1a12); box-shadow:inset 0 0 0 .2rem rgba(0,0,0,.35)}
.hpbar{position:absolute; top:.6rem; width:32%; height:1.3rem; background:rgba(0,0,0,.6); border:.14rem solid #fff; border-radius:.4rem; overflow:hidden}
.hpbar.you{left:1rem} .hpbar.foe{right:1rem}
.hpbar .fill{height:100%; background:linear-gradient(#8cff5a,#2e9e2e); transition:width .25s}
.hpbar.foe .fill{background:linear-gradient(#ff9a5a,#c0392b); margin-left:auto}
.hpname{position:absolute; top:2.1rem; font-size:1rem; font-weight:900; text-shadow:0 2px 4px #000}
.hpname.you{left:1rem} .hpname.foe{right:1rem; text-align:right}
.fighter{position:absolute; bottom:22%; width:9rem; height:12rem; transform:translateX(0); will-change:transform}
.fighter svg{width:100%; height:100%; overflow:visible}
.fighter .arm{transition:transform .12s}
.fighter.punch .arm-r{transform:translate(1.6rem, .2rem) rotate(-20deg)}
.fighter.hit svg{animation:hitflash .3s}
.fighter.ko{transition:transform .7s ease-in; transform:translateX(var(--x)) rotate(85deg) translateY(2rem)}
.fighter.poke svg{animation:poke .3s}
.bubble{position:absolute; bottom:70%; font-size:2.2rem; font-weight:900; color:#fff; -webkit-text-stroke:.12rem #000; text-shadow:0 .2rem 0 #000; opacity:0; pointer-events:none}
.bubble.show{animation:bubble .8s ease-out forwards}
.fightmsg{position:absolute; left:50%; top:30%; transform:translate(-50%,-50%); font-size:3.4rem; font-weight:900; color:var(--accent); -webkit-text-stroke:.14rem #000; text-shadow:0 .3rem 0 #000; opacity:0; pointer-events:none; white-space:nowrap}
.fightmsg.show{animation:popc .5s ease-out forwards}
.pad{display:flex; gap:1rem; align-items:center}
.pad .btn{min-width:8rem}

/* Climb */
.climb{position:relative; width:100%; height:100%}
.climb > svg{position:absolute; inset:0; width:100%; height:100%; transition:opacity .5s}
.climb.revealed > svg{opacity:0}
#hiker{transition:transform .8s ease-in-out}
.trailseg{stroke:rgba(255,255,255,.45); stroke-width:6; stroke-dasharray:14 14; fill:none; stroke-linecap:round}
.trailseg.done{stroke:#ffd98a; stroke-dasharray:none}
.dust{opacity:0; transform-box:fill-box; transform-origin:center}
.dust.show{animation:dust 1.2s ease-out}
.reveal{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; opacity:0; transform:scale(.9); transition:opacity .7s, transform .7s}
.reveal.show{opacity:1; transform:scale(1)}
.reveal .frame{padding:.5rem; background:#fbf7ef; box-shadow:0 1rem 2.4rem rgba(0,0,0,.6); border-radius:.2rem}
.reveal img{display:block; height:50vh; width:auto; max-width:64vw; object-fit:cover}
.reveal .cap{font-size:1.15rem; font-weight:800; text-shadow:0 2px 6px #000}

/* Paper football */
.kickwrap{display:flex; align-items:center; gap:1.5rem; width:100%; height:100%}
.kick{position:relative; flex:1 1 auto; height:100%; touch-action:none; user-select:none; cursor:grab}
.kick svg{width:100%; height:100%}
.kick .meter{transition:none}
.good-text{font-size:110px; font-weight:900; fill:#fff; stroke:#97233F; stroke-width:8; paint-order:stroke; text-anchor:middle; opacity:0; pointer-events:none}
.good-text.show{opacity:1; animation:pop .6s ease-out}
.kickside{display:flex; flex-direction:column; align-items:center; gap:.6rem; flex:0 0 auto}
.kickside .polaroid{opacity:0; transform:rotate(3deg) scale(.6); transition:opacity .5s, transform .5s}
.kickside .polaroid.show{opacity:1; transform:rotate(3deg) scale(1)}
.attempt{font-size:1.4rem; font-weight:900; color:var(--accent)}

/* Pin the rice paddy hat */
.pinwrap{display:flex; align-items:center; justify-content:center; gap:2rem; width:100%; height:100%}
.pin{position:relative; height:100%; aspect-ratio:1421/1920; cursor:crosshair; user-select:none; touch-action:none; box-shadow:0 1rem 2.4rem rgba(0,0,0,.6); background:#111; overflow:visible}
.pin img{display:block; height:100%; width:100%; object-fit:cover; pointer-events:none; border:.4rem solid #fbf7ef; box-sizing:border-box}
.pin .blind{position:absolute; inset:0; background:#0b1416; display:flex; align-items:center; justify-content:center; text-align:center; font-size:1.4rem; font-weight:900; color:var(--accent); padding:1rem; transition:opacity .35s; pointer-events:none}
.pin.pinned .blind{opacity:0}
.pin .hat{position:absolute; width:46%; aspect-ratio:2/1; transform:translate(-50%,-92%); pointer-events:none; filter:drop-shadow(0 .4rem .6rem rgba(0,0,0,.6)); transition:none}
.pin.pinned .hat{animation:pop .4s ease-out}
.pin .target{position:absolute; width:6%; aspect-ratio:1; border:.2rem dashed rgba(255,255,255,.6); border-radius:50%; transform:translate(-50%,-50%); opacity:0; pointer-events:none}
.pin.pinned .target{opacity:.8}
.pinside{display:flex; flex-direction:column; align-items:center; gap:.7rem; max-width:22rem; text-align:center}
.pinside .score{font-size:2.4rem; font-weight:900; color:var(--accent); line-height:1}
.pinside .card p{font-size:1rem}

/* Badge */
.badge{display:inline-flex; flex-direction:column; align-items:center; gap:.3rem}
.badge svg{width:9rem; height:9rem; filter:drop-shadow(0 .5rem .8rem rgba(0,0,0,.6))}
.badge.small svg{width:5rem; height:5rem}
.badge .bname{font-size:.95rem; font-weight:900; text-transform:uppercase; letter-spacing:.08em; text-align:center}
.earned{display:flex; align-items:center; justify-content:center; gap:2.5rem; width:100%}
.earned-left{display:flex; flex-direction:column; align-items:center; gap:.5rem; max-width:34rem; text-align:center}
.earned.multi .earned-left{max-width:22rem}
.earned-left .bname{font-size:2rem; font-weight:900; color:var(--accent)}
.earned .badge .bname{display:none}
.earned-left .rtext{font-size:1.25rem}

/* Summit flag */
.flagwrap{position:relative; width:min(74rem,100%); height:46vh; display:flex; align-items:flex-end; justify-content:center}
.pole{position:absolute; left:34%; bottom:0; width:.5rem; height:100%; background:linear-gradient(#e8e0cc,#8d846f); border-radius:.3rem; transform:translateX(-50%); box-shadow:0 0 .6rem rgba(0,0,0,.6)}
.cloth{position:absolute; left:34%; top:.5rem; width:34rem; height:16rem; background:linear-gradient(135deg,#fff8e6,#f1e4c4); clip-path:polygon(0 0, 100% 0, 93% 50%, 100% 100%, 0 100%); box-shadow:0 1rem 2rem rgba(0,0,0,.5); display:flex; flex-wrap:wrap; justify-content:center; align-content:center; padding:.6rem 3rem .6rem 1rem; gap:.3rem .6rem; transform-origin:left center; animation:wave 4s ease-in-out infinite}
.cloth .slot{position:relative; display:flex; justify-content:center; width:7.2rem}
.cloth .ghost{position:absolute; left:50%; top:2.2rem; width:4rem; height:4rem; transform:translate(-50%,-50%); border:.18rem dashed rgba(0,0,0,.22); border-radius:50%}
.cloth .badge{color:#2b2b2b; opacity:0; transform:translateY(60vh) scale(.3); transition:transform .6s cubic-bezier(.3,1.3,.5,1), opacity .4s}
.cloth .badge.land{opacity:1; transform:translateY(0) scale(1)}
.cloth .badge svg{width:4.4rem; height:4.4rem}
.cloth .badge .bname{font-size:.66rem}

/* Trail register entries */
.entries{display:grid; grid-template-columns:1fr 1fr; gap:1rem; width:min(76rem,100%)}
.entry{background:#fdf6e3; color:#2b2b2b; border-radius:.3rem; padding:.7rem 1.1rem .8rem; box-shadow:0 .6rem 1.4rem rgba(0,0,0,.5);
  background-image:repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.5rem - 2px), rgba(120,90,40,.22) calc(1.5rem - 2px), rgba(120,90,40,.22) 1.5rem);
  transform:rotate(var(--rot,0deg)) scale(.5); opacity:0; transition:transform .45s cubic-bezier(.3,1.4,.5,1), opacity .3s}
.entry.show{transform:rotate(var(--rot,0deg)) scale(1); opacity:1}
.entry .who{font-size:.9rem; font-weight:900; text-transform:uppercase; letter-spacing:.1em; color:#8a4b1f; border-bottom:2px solid #c9a86a; padding-bottom:.2rem; margin-bottom:.35rem}
.entry .msg{font-size:1.05rem; line-height:1.5rem; font-style:italic; font-weight:700}
.entry .sig{font-size:1rem; font-weight:900; text-align:right; margin-top:.3rem; font-style:italic}

/* Expedition log + filmstrip + toast */
.logwrap{display:flex; align-items:center; justify-content:center; gap:2.5rem; width:100%}
.log{max-width:36rem}
.log p{font-size:1.25rem; line-height:1.5; margin-bottom:.6rem}
.log p.final{font-size:1.6rem; font-weight:900; color:var(--accent)}
.filmstrip{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.7rem; max-width:30vw}
.filmstrip img{height:24vh; width:auto; border:.3rem solid #fbf7ef; box-shadow:0 .6rem 1.4rem rgba(0,0,0,.6); background:#111}
.toast{position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; background:rgba(10,14,28,.78); opacity:0; transition:opacity .3s}
.toast.show{opacity:1}
.toast .glasses{display:flex; align-items:flex-end; gap:.4rem; height:40vh}
.toast .glass{width:6rem; height:100%; transform-origin:50% 95%}
.toast.show .glass.l{animation:clinkL 1.3s ease-in-out forwards}
.toast.show .glass.r{animation:clinkR 1.3s ease-in-out forwards}
.toast .spark{position:absolute; left:50%; top:38%; font-size:4rem; opacity:0; transform:translate(-50%,-50%) scale(.2)}
.toast.show .spark{animation:spark .7s .75s ease-out forwards}
.toast .cheers{font-size:3rem; font-weight:900; color:var(--accent); text-shadow:0 .3rem 0 rgba(0,0,0,.5); opacity:0}
.toast.show .cheers{animation:pop .5s .9s ease-out forwards}

/* Closing */
.closing{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6rem; z-index:1}
.closing .frame{padding:.6rem; background:#fbf7ef; box-shadow:0 1.2rem 3rem rgba(0,0,0,.65)}
.closing img{display:block; height:62vh; width:auto; max-width:80vw; object-fit:cover}
.closing h1{font-size:3rem; margin:0; text-shadow:0 .25rem 0 rgba(0,0,0,.4), 0 .6rem 1.4rem rgba(0,0,0,.6)}
.closing .sub2{font-size:1.5rem; font-weight:900; color:var(--accent); text-shadow:0 2px 8px #000}
.restart-link{position:absolute; right:1rem; bottom:.7rem; font-size:.6rem; opacity:.55; color:#fff; text-decoration:underline; cursor:pointer; z-index:3}

#confetti{position:fixed; inset:0; z-index:30; pointer-events:none}

/* ---------- Animations (state animations all <= 1.5s) ---------- */
@keyframes pulse{0%,100%{r:14}50%{r:18}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(2.5);opacity:0}60%{transform:translate(-50%,-50%) rotate(-6deg) scale(.95);opacity:1}100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:1}}
.badge.stamp svg{animation:stamp2 .6s ease-out}
@keyframes stamp2{0%{transform:rotate(-12deg) scale(2.4);opacity:0}60%{transform:rotate(3deg) scale(.95);opacity:1}100%{transform:rotate(0) scale(1);opacity:1}}
@keyframes dust{0%{opacity:0;transform:scale(.3) translateY(0)}30%{opacity:.9}100%{opacity:0;transform:scale(2.2) translateY(-40px)}}
@keyframes bzzt{0%,100%{background:transparent}25%,75%{background:rgba(220,40,40,.35)}50%{background:rgba(220,40,40,.1)}}
@keyframes hitflash{0%,100%{filter:none;transform:translateX(0)}30%{filter:brightness(2.2) saturate(.2);transform:translateX(.6rem)}60%{transform:translateX(-.3rem)}}
@keyframes poke{0%,100%{transform:translateX(0)}40%{transform:translateX(-1.4rem)}}
@keyframes popc{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}70%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes bubble{0%{opacity:0;transform:translateY(0) scale(.5) rotate(-8deg)}30%{opacity:1;transform:translateY(-1rem) scale(1.1) rotate(4deg)}100%{opacity:0;transform:translateY(-3rem) scale(1) rotate(0)}}
@keyframes clinkL{0%{transform:rotate(0)}45%{transform:rotate(22deg) translateX(1.2rem)}60%{transform:rotate(18deg) translateX(1rem)}100%{transform:rotate(22deg) translateX(1.2rem)}}
@keyframes clinkR{0%{transform:rotate(0)}45%{transform:rotate(-22deg) translateX(-1.2rem)}60%{transform:rotate(-18deg) translateX(-1rem)}100%{transform:rotate(-22deg) translateX(-1.2rem)}}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(2)}}
/* ambient loops (decorative only, never gate progress) */
@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.08)}}
@keyframes leaf{0%{transform:translate(0,-80px) rotate(0)}100%{transform:translate(90px,980px) rotate(600deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:.35}100%{transform:translateY(-140px) scale(1.6);opacity:0}}
@keyframes wave{0%,100%{transform:skewY(0deg)}50%{transform:skewY(1.5deg)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.leaf{animation:leaf 8s linear infinite}
.tw{animation:twinkle 3s ease-in-out infinite}
.bl{animation:blink 1.6s ease-in-out infinite}
.smoke{animation:smoke 3s ease-out infinite; transform-box:fill-box; transform-origin:center}
.ff{animation:twinkle 2.6s ease-in-out infinite}
.star{animation:twinkle 4s ease-in-out infinite}
.swing{animation:sway 3s ease-in-out infinite; transform-box:fill-box; transform-origin:top center}
.summit-sky .dawn{opacity:0; transition:opacity 1.5s ease}
.summit-sky.day .dawn{opacity:1}
.summit-sky .stars{transition:opacity 1.5s ease}
.summit-sky.day .stars{opacity:0}
.summit-sky.instant .dawn, .summit-sky.instant .stars{transition:none}

/* ==================================================================
   PHONE — portrait phones and narrow screens. The TV layout above
   assumes a wide 16:9 stage; here every screen becomes one scrolling
   column, the backdrop stays fixed behind it, buttons are thumb-sized
   and the primary button sticks to the bottom edge.
   ================================================================== */
@media (max-width: 760px), (orientation: portrait) and (max-width: 1024px){
  :root{ --fs: clamp(13px, 4.2vw, 17px); --hud-h: auto; }
  body{ font-weight:600 }

  /* HUD wraps onto two lines: chapter name + sound, trail map below */
  #hud{ height:auto; flex:0 0 auto; flex-wrap:wrap; gap:.25rem .6rem; padding:.45rem 5.4rem .35rem .8rem; background:linear-gradient(to bottom, rgba(0,0,0,.6), rgba(0,0,0,.25)); }
  #hud-chapter{ font-size:.8rem; white-space:normal; line-height:1.15 }
  #trail{ width:100%; height:auto; margin:0; flex:1 0 100% }
  #sound{ top:.4rem; right:.6rem }
  .tiny{ font-size:.7rem; padding:.3rem .55rem }

  /* Screens scroll; the scene is pinned to the viewport behind them */
  .screen{ overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain }
  .scene{ position:fixed; inset:0 }
  .content{ flex:1 0 auto; min-height:0; justify-content:flex-start; padding:.9rem 1rem .4rem; gap:.8rem; width:100%; max-width:100% }
  .screen[data-screen=title] .content{ margin-left:0; padding-right:1rem; justify-content:flex-end; min-height:calc(100dvh - 8rem) }
  .screen[data-screen=title] .lead{ max-width:100% }
  .actions{ position:sticky; bottom:0; flex-wrap:wrap; gap:.6rem; padding:.9rem 1rem calc(.9rem + env(safe-area-inset-bottom)); background:linear-gradient(to top, rgba(0,0,0,.72) 55%, rgba(0,0,0,0)); }
  .actions:empty{ display:none }
  .hints{ display:none }

  /* Type */
  .do{ position:static; transform:none; white-space:normal; text-align:center; font-size:.85rem; padding:.3rem .9rem; margin:0 auto; max-width:100%; line-height:1.25 }
  .kicker{ font-size:.75rem; text-align:center }
  h1.giant{ font-size:2.9rem; text-align:center }
  .sub{ font-size:1.25rem; letter-spacing:.22em; text-align:center }
  h2{ font-size:1.45rem; text-align:center }
  h2.q{ max-width:100% }
  .lead{ font-size:1.05rem; max-width:100%; text-align:center }
  .card{ padding:.8rem 1rem; border-radius:.8rem; width:100% }
  .card p{ font-size:1rem }
  .card.narration{ max-width:100% }
  .card.narration h2{ text-align:left }
  .card.narration .kicker{ text-align:left }
  .row{ flex-direction:column; gap:1rem }

  /* Buttons: at least a thumb tall, full width when stacked */
  .btn{ min-height:3.1rem; font-size:1.05rem; padding:.55rem 1.1rem; border-radius:.75rem }
  .btn.big{ min-height:3.4rem; font-size:1.15rem; padding:.6rem 1.4rem }
  .actions > .btn{ flex:1 1 auto }
  .actions .btn.primary, .actions .btn.continue{ flex:1 1 100% }
  .opts{ width:100%; gap:.6rem }
  .opts.n4, .opts.n5{ grid-template-columns:1fr; width:100% }
  .opt{ min-height:3rem; font-size:1rem }
  .opt .num{ width:1.7rem; height:1.7rem; font-size:.9rem }
  .reaction{ max-width:100% }
  .reaction p{ font-size:1.1rem }

  /* Photos */
  .polaroid{ transform:rotate(var(--rot, -3deg)) }
  .polaroid img{ max-height:40vh; max-width:min(78vw, 22rem) }
  .polaroid figcaption{ font-size:.9rem }
  .polaroid.sm img{ max-height:24vh; max-width:34vw }
  .photos{ flex-wrap:wrap; justify-content:center; gap:.9rem }

  /* Mini-games: the playfield sizes itself to its content */
  .content.mini{ gap:.6rem }
  .note{ font-size:1rem; min-height:0 }
  .note.big{ font-size:1.35rem }
  .playfield{ width:100%; height:auto; min-height:0; flex-direction:column }
  .playfield > svg{ width:100%; height:auto }

  /* Beer cans: 4 across the full width */
  .canswrap{ flex-direction:column; gap:.8rem; height:auto }
  .cans{ --canh:17vw; grid-template-columns:repeat(4, 1fr); width:100%; gap:.5rem .6rem; padding:.5rem .7rem }
  .can .back{ font-size:1.5rem }
  .can .front{ font-size:.72rem; padding:.2rem }
  .cansinfo{ flex-direction:row; flex-wrap:wrap; justify-content:center; gap:.3rem .9rem; min-width:0 }
  .cansinfo .kicker{ display:none }
  .cansinfo .timer{ font-size:1.8rem }
  .cansinfo .best{ flex:1 0 100%; text-align:center }

  /* Big House */
  .roar-text{ font-size:130px }

  /* Reactor */
  .reactor{ grid-template-columns:1fr; gap:.9rem; height:auto }
  .seq{ gap:.6rem }
  .gaugebox svg{ width:min(16rem, 70vw) }
  .readout{ font-size:1.2rem }
  .banner{ font-size:1.9rem; padding:.3rem 1rem; white-space:nowrap }

  /* Org chart: the layout switches to two columns (positions come from the script) */
  .org{ height:min(70vh, 34rem); width:100% }
  .obox{ min-width:6.5rem; max-width:44vw; padding:.4rem .5rem; border-radius:.6rem; border-width:.12rem }
  .obox .t{ font-size:.92rem }
  .obox .s{ font-size:.72rem }
  .obox.top{ min-width:9rem; max-width:70vw }
  .obox.top .t{ font-size:1.1rem }
  .org line{ stroke-width:3 }

  /* Cactus fight */
  .arena{ height:min(46vh, 22rem); width:100% }
  .fighter{ width:6rem; height:8rem; bottom:20% }
  .fighter.punch .arm-r{ transform:translate(1rem, .2rem) rotate(-20deg) }
  .hpbar{ width:36%; height:1rem }
  .hpname{ font-size:.75rem; top:1.75rem }
  .bubble{ font-size:1.4rem }
  .fightmsg{ font-size:1.7rem; white-space:normal; width:92%; text-align:center; line-height:1.1 }
  .pad{ gap:.5rem; width:100%; justify-content:center }
  .pad .btn{ min-width:0; flex:1 1 0; padding:.55rem .5rem }
  .pad .btn.big{ flex:1.4 1 0 }

  /* Climb */
  .climb{ height:auto; aspect-ratio:1200/700 }
  .reveal img{ height:auto; max-height:50vh; width:auto; max-width:82vw }
  .reveal .cap{ font-size:.95rem; text-align:center; padding:0 1rem }

  /* Paper football */
  .kickwrap{ flex-direction:column; gap:.8rem; height:auto }
  .kick{ width:100%; height:auto; flex:0 0 auto }
  .kick svg{ height:auto }
  .kickside{ flex-direction:row; flex-wrap:wrap; justify-content:center; gap:.4rem .9rem }
  .kickside .polaroid{ flex:1 0 100%; align-self:center; margin:0 auto; width:max-content; max-width:100% }
  .attempt{ font-size:1.2rem }

  /* Pin the hat */
  .pinwrap{ flex-direction:column; gap:.9rem; height:auto }
  .pin{ height:auto; width:min(100%, calc(52vh * 1421 / 1920)) }
  .pin img{ height:auto; aspect-ratio:1421/1920; border-width:.3rem }
  .pin .blind{ font-size:1.1rem }
  .pinside{ max-width:100% }
  .pinside .score{ font-size:1.8rem }

  /* Badges */
  .badge svg{ width:7rem; height:7rem }
  .earned{ flex-direction:column; gap:1rem }
  .earned-left, .earned.multi .earned-left{ max-width:100% }
  .earned-left .bname{ font-size:1.5rem }
  .earned-left .rtext{ font-size:1.05rem }

  /* Summit flag */
  .flagwrap{ width:100%; height:auto; min-height:0; align-items:flex-start; padding-left:6% }
  .pole{ left:6%; top:0; height:calc(100% + 1.2rem); width:.4rem }
  .cloth{ position:relative; left:0; top:.4rem; width:100%; height:auto; padding:.6rem 2rem .6rem .8rem; gap:.4rem .3rem; clip-path:polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%) }
  .cloth .slot{ width:23% }
  .cloth .ghost{ top:1.8rem; width:3.2rem; height:3.2rem }
  .cloth .badge svg{ width:3.4rem; height:3.4rem }
  .cloth .badge .bname{ font-size:.55rem }

  /* Trail register */
  .entries{ grid-template-columns:1fr; gap:.8rem; width:100% }
  .entry .msg{ font-size:.98rem }

  /* Log + toast */
  .logwrap{ flex-direction:column; gap:1rem }
  .log{ max-width:100% }
  .log p{ font-size:1.05rem }
  .log p.final{ font-size:1.3rem }
  .filmstrip{ max-width:100%; gap:.5rem }
  .filmstrip img{ height:auto; width:calc(50% - .5rem); aspect-ratio:1; object-fit:cover; border-width:.2rem }
  .toast{ position:fixed; z-index:15 }
  .toast .glasses{ height:28vh; gap:.2rem }
  .toast .glass{ width:3.2rem }
  .toast .cheers{ font-size:2rem; text-align:center; padding:0 1rem }

  /* Closing */
  .closing{ position:relative; inset:auto; min-height:100%; padding:1.2rem 1rem 3rem; gap:.8rem }
  .closing img{ height:auto; max-height:58vh; width:auto; max-width:84vw }
  .closing h1{ font-size:2rem; text-align:center }
  .closing .sub2{ font-size:1.15rem; text-align:center }
  .restart-link{ position:fixed; font-size:.75rem; opacity:.7; padding:.5rem }
}
/* Short landscape phones: the TV layout at a readable minimum size */
@media (max-height: 480px) and (orientation: landscape){
  :root{ --fs: max(11px, min(1.5vw, 2.7vh)) }
}
</style>
</head>

<script>
(() => {
'use strict';

/* ==================================================================
   1. CONTENT — every word Chuck sees lives here. Edit freely.
   ================================================================== */

/* Phones: coarse pointer means wording says "tap", and the org chart stacks two-wide */
const TOUCH = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
const phoneLayout = () => window.matchMedia('(max-width: 760px), (orientation: portrait) and (max-width: 1024px)').matches;

const TOTAL = 8;
const CHAPTERS = {
  1: { name:'Maryland',         theme:'maryland', scene:'maryland', badge:'Cabin John Kid' },
  2: { name:'Ann Arbor',        theme:'michigan', scene:'annarbor', badge:'The Wolverine' },
  3: { name:'The Reactor Room', theme:'navy',     scene:'reactor',  badge:'Nuke' },
  4: { name:'Clemson',          theme:'clemson',  scene:'clemson',  badge:'The Tiger' },
  5: { name:'The Desert',       theme:'desert',   scene:'desert',   badge:'Desert Fox' },
  6: { name:'Thursday Night',   theme:'friday',   scene:'friday',   badge:'Captain of the Crew' },
  7: { name:'Vietnam',          theme:'vietnam',  scene:'vietnam',  badge:'Frequent Flyer' },
  8: { name:'The Summit',       theme:'summit',   scene:'summit',   badge:'The Summit' },
};

const WRONG_TEXT = 'Aww boner. The room disagrees — try again.';

const screens = [
  /* ---------- TITLE ---------- */

function sceneHTML(name, mode = '') {                 /* mode: '' (full), 'dim' (behind text), 'soft' (games) */
  const layers = SCENES[name]();
  const depth = [0.25, 0.55, 1];
  return `<div class="scene ${mode}">${layers.map((l, i) => `<div class="layer" data-depth="${depth[i]}">${l}</div>`).join('')}</div>`;
}
function polaroid(p, rot, extra = '') {
  if (!p) return '';
  return `<figure class="polaroid ${extra}" style="--rot:${rot}deg"><img src="${p.src}" alt=""><figcaption>${p.caption || ''}</figcaption></figure>`;
}
/* one or several photos beside a badge */
function photosHTML(s) {
  const list = s.photos || (s.photo ? [s.photo] : []);
  if (list.length <= 1) return polaroid(list[0], -3);
  const rots = [-4, 2, -2];
  return `<div class="photos">${list.map((p, i) => polaroid(p, rots[i % 3], 'sm')).join('')}</div>`;
}
function earnedHTML(s) {
  const list = s.photos || (s.photo ? [s.photo] : []);
  return `<div class="earned ${list.length > 1 ? 'multi' : ''}" hidden>
    <div class="earned-left">${badgeHTML(s.chapter)}<div class="kicker">Badge earned</div><div class="bname">${CHAPTERS[s.chapter].badge}</div><p class="rtext">${s.reaction}</p></div>
    ${photosHTML(s)}
  </div>`;
}

/* ==================================================================
   4. MINI-INTERACTIONS
   Each mini has build(), init(el, local, api) and either step() (one big
   button) or act(action, btn, el, local, api) for custom clicks. The api
   object updates the note / button and finishes the screen.
   ================================================================== */
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const MINI = {
  /* ---- Chapter 1: beer-can matching game (4x4, 8 pairs, timed) ---- */
  cans: {
    actions() { return `<button class="btn ghostbtn" data-action="reset">${MINI_TEXT.cans.again}</button><button class="btn primary big continue" data-action="next" hidden>Continue →</button>`; },
    build() {
      const T = MINI_TEXT.cans;
      const cards = Array.from({ length: 16 }, (_, i) => `<button class="can" data-action="flip" data-i="${i}" type="button" tabindex="-1"><div class="inner"><div class="face back">?</div><div class="face front"></div></div></button>`).join('');
      return `<div class="canswrap"><div class="cans">${cards}</div>
        <div class="cansinfo"><div class="kicker">Time</div><div class="timer">0 s</div><div class="pairs">Pairs: 0 of 8</div><div class="best"></div></div></div>`;
    },
    deal(el, local) {
      const T = MINI_TEXT.cans;
      const deck = shuffle([...Array(8).keys(), ...Array(8).keys()]);
      el.querySelectorAll('.can').forEach((c, i) => {
        const p = deck[i]; c.dataset.p = p; c.classList.remove('up', 'matched', 'hi');
        const f = c.querySelector('.front'); f.style.setProperty('--c', T.colors[p]); f.textContent = T.labels[p];
      });
      local.open = []; local.pairs = 0; local.t0 = null; local.busy = false; local.doneFlag = false; local.cursor = 0;
      el.querySelector('.timer').textContent = '0 s'; el.querySelector('.pairs').textContent = 'Pairs: 0 of 8';
      this.showBest(el);
    },
    best() { try { return +localStorage.getItem('chuck65-cans-best') || 0; } catch (e) { return 0; } },
    showBest(el) { const b = this.best(); el.querySelector('.best').textContent = b ? `${MINI_TEXT.cans.bestLabel}: ${b} s` : 'No record yet. Set one.'; },
    init(el, local, api) {
      this.deal(el, local);
      api.note(MINI_TEXT.cans.intro);
      local.timer = setInterval(() => { if (local.t0 && !local.doneFlag) el.querySelector('.timer').textContent = Math.floor((performance.now() - local.t0) / 1000) + ' s'; }, 200);
      local.cleanup = () => clearInterval(local.timer);
      local.onKey = (k) => {                       /* arrows move the highlight, Enter/Space flips */
        if (local.doneFlag) return false;
        const cards = [...el.querySelectorAll('.can')];
        const move = { ArrowLeft:-1, ArrowRight:1, ArrowUp:-4, ArrowDown:4 }[k];
        if (move !== undefined) { local.cursor = ((local.cursor + move) % 16 + 16) % 16; cards.forEach((c, i) => c.classList.toggle('hi', i === local.cursor)); return true; }
        if (k === 'Enter' || k === ' ') { this.flip(cards[local.cursor], el, local, api); return true; }
        return false;
      };
    },
    flip(card, el, local, api) {
      const T = MINI_TEXT.cans;
      if (!card || local.busy || local.doneFlag || card.classList.contains('up')) return;
      if (!local.t0) local.t0 = performance.now();
      card.classList.add('up'); Sound.blip(); local.open.push(card);
      if (local.open.length < 2) return;
      const [a, b] = local.open; local.open = [];
      if (a.dataset.p === b.dataset.p) {
        a.classList.add('matched'); b.classList.add('matched'); local.pairs++;
        el.querySelector('.pairs').textContent = `Pairs: ${local.pairs} of 8`; Sound.chime();
        if (local.pairs === 8) {
          local.doneFlag = true;
          const secs = Math.max(1, Math.round((performance.now() - local.t0) / 1000));
          el.querySelector('.timer').textContent = secs + ' s';
          const best = this.best(); let msg = T.done(secs);
          if (!best || secs < best) { try { localStorage.setItem('chuck65-cans-best', String(secs)); } catch (e) {} msg += ' ' + T.record(secs); }
          this.showBest(el); Sound.cheer(); Confetti.burst(150);
          api.finish(msg, 'Press Continue, or play again for a faster time.');
        }
      } else {
        local.busy = true;
        setTimeout(() => { a.classList.remove('up'); b.classList.remove('up'); local.busy = false; }, 750);
      }
    },
    act(action, btn, el, local, api) {
      if (action === 'flip') this.flip(btn, el, local, api);
      if (action === 'reset') { this.deal(el, local); api.reset(MINI_TEXT.cans.intro, MINI_TEXT.cans.do); }
    },
  },

  /* ---- Chapter 2: Fill the Big House by clicking sections ---- */
  bighouse: {
    actions() { return `<button class="btn primary big continue" data-action="next" hidden>Continue →</button>`; },
    build() {
      const cx = 600, cy = 360, rxO = 560, ryO = 300, rxI = 300, ryI = 140, r = rng(5);
      let secs = '', fans = '';
      for (let s = 0; s < 8; s++) {
        const a0 = s/8*Math.PI*2, a1 = (s+1)/8*Math.PI*2, pts = [];
        for (let k = 0; k <= 6; k++) { const a = a0 + (a1-a0)*k/6; pts.push(`${(cx+Math.cos(a)*rxO).toFixed(0)},${(cy+Math.sin(a)*ryO).toFixed(0)}`); }
        for (let k = 6; k >= 0; k--) { const a = a0 + (a1-a0)*k/6; pts.push(`${(cx+Math.cos(a)*rxI).toFixed(0)},${(cy+Math.sin(a)*ryI).toFixed(0)}`); }
        secs += `<polygon class="section" data-action="fill" data-s="${s}" points="${pts.join(' ')}"/>`;
        let f = '';
        for (let i = 0; i < 46; i++) { const a = a0 + (a1-a0)*r(), t = .12 + r()*.76; f += `<circle class="fan" cx="${(cx+Math.cos(a)*(rxI+t*(rxO-rxI))).toFixed(0)}" cy="${(cy+Math.sin(a)*(ryI+t*(ryO-ryI))).toFixed(0)}" r="5" fill="${r()<.6?'#FFCB05':'#e8eefc'}" style="animation-delay:${(r()*.2).toFixed(2)}s"/>`; }
        fans += `<g class="fans" data-s="${s}">${f}</g>`;
      }
      let yards = '';
      for (let i = 1; i < 10; i++) yards += `<line x1="${cx-rxI*.8+i*(rxI*1.6/10)}" y1="${cy-ryI*.55}" x2="${cx-rxI*.8+i*(rxI*1.6/10)}" y2="${cy+ryI*.55}" stroke="#fff" stroke-width="2" opacity=".6"/>`;
      return `<svg class="bighouse" viewBox="0 0 1200 720"><ellipse cx="${cx}" cy="${cy+10}" rx="${rxO+16}" ry="${ryO+16}" fill="#0b1a2e"/>${secs}
        <ellipse cx="${cx}" cy="${cy}" rx="${rxI}" ry="${ryI}" fill="#2f7d32" stroke="#fff" stroke-width="3" pointer-events="none"/>${yards}<rect x="${cx-rxI*.8}" y="${cy-ryI*.55}" width="${rxI*1.6}" height="${ryI*1.1}" fill="none" stroke="#fff" stroke-width="3"/>
        ${fans}<text class="roar-text" x="600" y="400">${MINI_TEXT.bighouse.center}</text></svg>`;
    },
    init(el, local, api) {
      local.n = 0; api.note('Sections filled: 0 of 8');
      local.onKey = (k) => {                       /* Enter/Space fills the next empty section */
        if (k !== 'Enter' && k !== ' ') return false;
        const next = el.querySelector('.section:not(.full)'); if (!next) return false;
        this.act('fill', next, el, local, api); return true;
      };
    },
    act(action, poly, el, local, api) {
      if (action !== 'fill' || poly.classList.contains('full')) return;
      const T = MINI_TEXT.bighouse, svg = el.querySelector('.bighouse'), s = poly.dataset.s;
      poly.classList.add('full');
      svg.querySelectorAll(`.fans[data-s="${s}"] .fan`).forEach(f => f.classList.add('show'));
      Sound.blip(); local.n++;
      if (local.n >= 8) { svg.classList.add('roar'); svg.querySelector('.roar-text').classList.add('show'); Sound.cheer(); Confetti.burst(160); api.finish(T.done); }
      else api.note(T.notes[local.n - 1]);
    },
  },

  /* ---- Chapter 3: reactor startup, correct order only, no hints ---- */
  simon: {
    actions() { return `<button class="btn primary big continue" data-action="next" hidden>Continue →</button>`; },
    build() {
      const T = MINI_TEXT.simon;
      let ticks = '';
      for (let k = 0; k <= 12; k++) ticks += `<line x1="200" y1="46" x2="200" y2="${k%3===0?70:60}" stroke="#8fa0b0" stroke-width="5" transform="rotate(${-120+k*20} 200 200)"/>`;
      return `<div class="reactor">
        <div class="seq">
          <div class="opts n5">${T.shown.map((idx, k) => `<button class="btn opt" data-action="press" data-step="${idx}" type="button"><span class="num">${k+1}</span><span class="lbl">${T.steps[idx]}</span></button>`).join('')}</div>
          <div class="lamps">${[0,1,2,3,4].map(() => `<span class="lamp"></span>`).join('')}</div>
        </div>
        <div class="gaugebox"><svg viewBox="0 0 400 300"><path d="M52 290 A160 160 0 1 1 348 290" fill="none" stroke="#0b0f14" stroke-width="44"/><path d="M52 290 A160 160 0 1 1 348 290" fill="none" stroke="#3a4653" stroke-width="30"/>
          <path d="M270 62 A160 160 0 0 1 348 290" fill="none" stroke="#f5a623" stroke-width="30" opacity=".85"/>${ticks}
          <line class="needle" x1="200" y1="200" x2="200" y2="58" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="200" cy="200" r="16" fill="#f5a623"/>
          <text x="200" y="262" text-anchor="middle" font-size="26" font-weight="800" fill="#8fa0b0">REACTOR POWER</text></svg>
          <div class="readout">0%</div></div>
        <div class="banner">AHEAD, FULL.</div></div>`;
    },
    init(el, local, api) { local.n = 0; api.note(MINI_TEXT.simon.intro); },
    setPower(el, n) { el.querySelector('.needle').style.transform = `rotate(${-120 + n*20*2.4}deg)`; el.querySelector('.readout').textContent = (n*20) + '%'; el.querySelectorAll('.lamp').forEach((l, i) => l.classList.toggle('on', i < n)); },
    act(action, btn, el, local, api) {
      if (action !== 'press' || local.won) return;
      const T = MINI_TEXT.simon, want = T.order[local.n], got = +btn.dataset.step;
      if (got === want) {
        local.n++; this.setPower(el, local.n); Sound.blip();
        if (local.n >= 5) { local.won = true; el.querySelector('.banner').classList.add('show'); Sound.fanfare(); api.finish(T.done); el.querySelectorAll('.opt').forEach(b => b.disabled = true); }
        else api.note(T.good[local.n - 1]);
      } else {
        local.n = 0; this.setPower(el, 0); Sound.buzzer();
        const box = el.querySelector('.reactor'); box.classList.remove('bzzt'); void box.offsetWidth; box.classList.add('bzzt');
        btn.classList.remove('wrong'); void btn.offsetWidth; btn.style.animation = 'shake .45s'; setTimeout(() => btn.style.animation = '', 500);
        api.note(T.bad, true);

  /* ---- Chapter 4: Build the org chart ---- */
  orgchart: {
    build() {
      const T = MINI_TEXT.orgchart;
      const phone = phoneLayout();
      const pos = (b) => phone && b.px !== undefined ? { x:b.px, y:b.py } : { x:b.x, y:b.y };
      const boxes = T.boxes.map((b, i) => `<div class="obox ${b.cls||''}" data-i="${i}" style="left:${pos(b).x}%;top:${pos(b).y}%"><div class="t">${b.t}</div><div class="s">${b.s}</div></div>`).join('');
      const lines = T.boxes.slice(1).map((b, i) => { const l = (phone && b.pline) || b.line || [50, 22, b.x, 62]; return `<line data-i="${i+1}" class="${b.cls==='dotted'?'dotted':''}" x1="${l[0]}%" y1="${l[1]}%" x2="${l[2]}%" y2="${l[3]}%"/>`; }).join('');
      return `<div class="org"><svg>${lines}</svg>${boxes}</div>`;
    },
    init(el, local) { local.n = 0; },
    step(el, local) {
      const T = MINI_TEXT.orgchart, i = local.n;
      el.querySelector(`.obox[data-i="${i}"]`).classList.add('show');
      const line = el.querySelector(`line[data-i="${i}"]`); if (line) line.classList.add('show');
      Sound.blip(); local.n++;

  /* ---- Chapter 7: pin the rice paddy hat on Chuck ---- */
  pinhat: {
    target: { x:.50, y:.19 },            /* where the crown of his head sits in suit-headshot.jpg (fractions of the photo box) */
    actions() { return `<button class="btn ghostbtn" data-action="retry" hidden>${MINI_TEXT.pinhat.again}</button><button class="btn primary big continue" data-action="next" hidden>Continue →</button>`; },
    build() {
      const T = MINI_TEXT.pinhat;
      const hat = `<svg class="hat" viewBox="0 0 200 100"><polygon points="100,6 196,92 4,92" fill="#e8c887" stroke="#8a6a3a" stroke-width="4" stroke-linejoin="round"/><g stroke="#b8925a" stroke-width="3"><line x1="100" y1="6" x2="52" y2="92"/><line x1="100" y1="6" x2="148" y2="92"/><line x1="100" y1="6" x2="100" y2="92"/><line x1="70" y1="60" x2="130" y2="60"/></g><ellipse cx="100" cy="92" rx="96" ry="6" fill="#8a6a3a"/></svg>`;
      return `<div class="pinwrap"><div class="pin"><img src="suit-headshot.jpg" alt=""><div class="target"></div><div class="blind">Blindfold on.<br>Where is the top of his head?</div>${hat}</div>
        <div class="pinside"><div class="kicker">Hat placement</div><div class="score">—</div><div class="card"><p>${T.caption}</p></div></div></div>`;
    },
    init(el, local, api) {
      const T = MINI_TEXT.pinhat, box = el.querySelector('.pin'), hat = box.querySelector('.hat'), tgt = box.querySelector('.target');
      tgt.style.left = (this.target.x*100) + '%'; tgt.style.top = (this.target.y*100) + '%';
      const place = (x, y) => { local.hx = Math.max(0, Math.min(1, x)); local.hy = Math.max(0, Math.min(1, y)); hat.style.left = (local.hx*100) + '%'; hat.style.top = (local.hy*100) + '%'; };
      const reset = () => { box.classList.remove('pinned'); local.pinned = false; place(.15 + Math.random()*.7, .3 + Math.random()*.5); el.querySelector('.score').textContent = '—'; api.reset(T.intro, T.do); el.querySelectorAll('[data-action="retry"]').forEach(b => b.hidden = true); };
      local.reset = reset; reset(); api.note(T.intro);
      const rel = (e) => { const r = box.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
      box.addEventListener('pointermove', e => { if (!local.pinned) place(...rel(e)); });
      box.addEventListener('pointerdown', e => { if (!local.pinned) { place(...rel(e)); this.pinIt(el, local, api); } });
      local.onKey = (k) => {
        if (local.pinned) return false;
        const d = { ArrowLeft:[-.03,0], ArrowRight:[.03,0], ArrowUp:[0,-.03], ArrowDown:[0,.03] }[k];
        if (d) { place(local.hx + d[0], local.hy + d[1]); return true; }
        if (k === 'Enter' || k === ' ') { this.pinIt(el, local, api); return true; }
        return false;
      };
    },
    pinIt(el, local, api) {
      const T = MINI_TEXT.pinhat, box = el.querySelector('.pin');
      local.pinned = true; box.classList.add('pinned');
      const dx = (local.hx - this.target.x) * (1421/1920), dy = local.hy - this.target.y;   /* scale x so a miss counts the same in both directions */
      const dist = Math.hypot(dx, dy);
      let msg, score;
      if (dist < .05) { msg = T.perfect; score = 'Bullseye'; Sound.cheer(); Confetti.burst(140); }
      else if (dist < .12) { msg = T.close; score = 'Close'; Sound.chime(); }
      else if (local.hy > this.target.y && dist < .3) { msg = T.low; score = 'Low'; Sound.wrong(); }
      else { msg = T.far; score = 'Way off'; Sound.wrong(); }
      el.querySelector('.score').textContent = score;
      api.finish(msg, 'Press Continue, or try again.');
      el.querySelectorAll('[data-action="retry"]').forEach(b => b.hidden = false);
    },
    act(action, btn, el, local, api) { if (action === 'retry') local.reset(); },
  },

  /* ---- Chapter 5: cactus fight (arrows move, space punches) ---- */
  fight: {
    actions() { return `<div class="pad"><button class="btn ghostbtn" data-action="left">◀ Move</button><button class="btn big" data-action="punch">PUNCH</button><button class="btn ghostbtn" data-action="right">Move ▶</button></div><button class="btn primary big continue" data-action="next" hidden>Continue →</button>`; },
    build() {
      const T = MINI_TEXT.fight;
      const you = `<svg viewBox="0 0 120 160"><g class="arm arm-l"><rect x="6" y="60" width="22" height="60" rx="11" fill="#2f8f3e"/><rect x="6" y="60" width="22" height="26" rx="11" fill="#3fae4f"/></g>
        <rect x="38" y="20" width="44" height="130" rx="22" fill="#2f8f3e"/><g stroke="#1f6b2c" stroke-width="3"><line x1="50" y1="30" x2="50" y2="140"/><line x1="60" y1="24" x2="60" y2="146"/><line x1="70" y1="30" x2="70" y2="140"/></g>
        <rect x="38" y="78" width="44" height="34" fill="#e0483c"/><circle cx="48" cy="86" r="3" fill="#ffd166"/><circle cx="62" cy="96" r="3" fill="#6ad4c8"/><circle cx="74" cy="84" r="3" fill="#ffd166"/><circle cx="54" cy="104" r="3" fill="#6ad4c8"/>
        <rect x="40" y="44" width="40" height="12" rx="4" fill="#111"/><rect x="42" y="46" width="16" height="8" fill="#333"/><rect x="62" y="46" width="16" height="8" fill="#333"/>
        <path d="M36 22 h48 l-6 -10 h-36 z" fill="#3a3a3a"/><rect x="34" y="20" width="52" height="5" rx="2" fill="#3a3a3a"/>
        <path d="M50 66 q10 8 20 0" stroke="#0f3f1a" stroke-width="3" fill="none"/>
        <g class="arm arm-r"><rect x="92" y="60" width="22" height="60" rx="11" fill="#2f8f3e"/><circle cx="103" cy="122" r="14" fill="#3fae4f" stroke="#1f6b2c" stroke-width="3"/></g></svg>`;
      let spines = '';
      for (let i = 0; i < 16; i++) { const a = i/16*Math.PI*2; spines += `<line x1="${(60+Math.cos(a)*44).toFixed(1)}" y1="${(100+Math.sin(a)*40).toFixed(1)}" x2="${(60+Math.cos(a)*58).toFixed(1)}" y2="${(100+Math.sin(a)*52).toFixed(1)}" stroke="#f2c14e" stroke-width="4" stroke-linecap="round"/>`; }
      const foe = `<svg viewBox="0 0 120 160">${spines}<ellipse cx="60" cy="100" rx="46" ry="42" fill="#4f8f2e"/><g stroke="#2f6b1c" stroke-width="4"><path d="M40 64 q-10 36 0 72"/><path d="M60 58 v84"/><path d="M80 64 q10 36 0 72"/></g>
        <circle cx="46" cy="92" r="6" fill="#fff"/><circle cx="74" cy="92" r="6" fill="#fff"/><circle cx="47" cy="93" r="3" fill="#111"/><circle cx="73" cy="93" r="3" fill="#111"/>
        <line x1="36" y1="80" x2="52" y2="86" stroke="#111" stroke-width="4"/><line x1="84" y1="80" x2="68" y2="86" stroke="#111" stroke-width="4"/><path d="M50 112 q10 -8 20 0" stroke="#111" stroke-width="3" fill="none"/>
        <ellipse cx="60" cy="58" rx="46" ry="10" fill="#c98b3a"/><path d="M40 58 q0 -30 20 -30 q20 0 20 30 z" fill="#e0a850"/><rect x="40" y="48" width="40" height="6" fill="#97233F"/></svg>`;
      return `<div class="arena">
        <div class="hpbar you"><div class="fill" style="width:100%"></div></div><div class="hpname you">${T.you}</div>
        <div class="hpbar foe"><div class="fill" style="width:100%"></div></div><div class="hpname foe">${T.foe}</div>
        <div class="fighter you">${you}</div><div class="fighter foe">${foe}</div>
        <div class="bubble"></div><div class="fightmsg">${T.intro}</div>
      </div>`;
    },
    init(el, local, api) {
      const T = MINI_TEXT.fight;
      const arena = el.querySelector('.arena'), you = el.querySelector('.fighter.you'), foe = el.querySelector('.fighter.foe');
      const W = () => arena.clientWidth, fw = () => you.clientWidth;
      const g = { px: 0, ex: 0, pHP: 100, eHP: 100, cool: 1.2, over: false, punching: false, down: {} };
      local.g = g;
      const place = () => { you.style.transform = `translateX(${g.px}px)`; foe.style.setProperty('--x', g.ex + 'px'); if (!g.over) foe.style.transform = `translateX(${g.ex}px)`; };
      const layout = () => { if (!g.started) { g.px = W()*.18; g.ex = W()*.68; g.started = true; place(); } };
      layout();
      api.note(T.keys);
      const msg = el.querySelector('.fightmsg'); msg.classList.add('show'); setTimeout(() => msg.classList.remove('show'), 1200);
      const bubble = (txt, x) => { const b = el.querySelector('.bubble'); b.textContent = txt; b.style.left = x + 'px'; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); };
      const dist = () => Math.abs((g.ex) - (g.px));
      g.punch = () => {
        if (g.over || g.punching) return;
        g.punching = true; you.classList.add('punch'); Sound.blip();
        setTimeout(() => { you.classList.remove('punch'); g.punching = false; }, 220);
        if (dist() <= fw() * 1.15) {
          g.eHP = Math.max(0, g.eHP - 20); el.querySelector('.hpbar.foe .fill').style.width = g.eHP + '%';
          foe.classList.remove('hit'); void foe.offsetWidth; foe.classList.add('hit');
          g.ex = Math.min(W() - fw(), g.ex + 50); place();
          bubble(T.hits[Math.floor(Math.random() * T.hits.length)], g.ex + fw() * .1); Sound.thud();
          if (g.eHP <= 0) {
            g.over = true; foe.classList.add('ko'); Sound.cheer(); Confetti.burst(160);
            msg.textContent = T.win; msg.classList.add('show');
            api.finish(T.done);
          }
        }
      };
      let last = performance.now();
      const loop = (now) => {
        if (!local.alive) return;
        const dt = Math.min(.05, (now - last) / 1000); last = now;
        if (!g.over) {
          const sp = W() * .45;
          if (g.down.ArrowLeft) g.px -= sp * dt; if (g.down.ArrowRight) g.px += sp * dt;
          g.px = Math.max(0, Math.min(W() - fw(), g.px));
          const d = g.ex - g.px;
          if (Math.abs(d) > fw() * 1.05) g.ex -= Math.sign(d) * W() * .09 * dt;   /* Barry waddles over slowly */
          g.cool -= dt;
          if (Math.abs(d) <= fw() * 1.2 && g.cool <= 0) {
            g.cool = 1.7; foe.classList.remove('poke'); void foe.offsetWidth; foe.classList.add('poke');
            g.pHP = Math.max(1, g.pHP - 4); el.querySelector('.hpbar.you .fill').style.width = g.pHP + '%';   /* he can never actually lose */
            bubble(T.pokes[Math.floor(Math.random() * T.pokes.length)], g.px + fw() * .2);
          }
          place();
        }
        requestAnimationFrame(loop);
      };
      local.alive = true; requestAnimationFrame(loop);
      local.cleanup = () => { local.alive = false; };
      local.onKey = (k) => {
        if (g.over) return false;
        if (k === 'ArrowLeft' || k === 'ArrowRight') { g.down[k] = true; return true; }
        if (k === ' ' || k === 'Enter') { g.punch(); return true; }
        return false;
      };
      local.onKeyUp = (k) => { delete g.down[k]; };
    },
    act(action, btn, el, local, api) {
      const g = local.g; if (!g || g.over) return;
      const W = el.querySelector('.arena').clientWidth, fw = el.querySelector('.fighter.you').clientWidth;
      if (action === 'left') g.px = Math.max(0, g.px - W * .09);
      if (action === 'right') g.px = Math.min(W - fw, g.px + W * .09);
      if (action === 'punch') g.punch();
      el.querySelector('.fighter.you').style.transform = `translateX(${g.px}px)`;
    },
  },

  /* ---- Chapter 5: Climb (with the sneeze beat and the photo reveal) ---- */
  climb: {
    pts: [[140,640],[440,600],[260,520],[560,470],[400,400],[700,340],[540,280],[780,250],[700,150]],
    build() {
      const P = this.pts;
      let segs = '';
      for (let i = 1; i < P.length; i++) segs += `<line class="trailseg" data-i="${i}" x1="${P[i-1][0]}" y1="${P[i-1][1]}" x2="${P[i][0]}" y2="${P[i][1]}"/>`;
      let flowers = '';
      for (let i = 0; i < 6; i++) flowers += `<circle cx="${-9+(i%3)*9}" cy="${-8+Math.floor(i/3)*12}" r="3" fill="${i%2?'#ffd166':'#6ad4c8'}"/>`;
      return `<div class="climb"><svg viewBox="0 0 1200 700">
        <polygon points="0,700 700,120 1200,700" fill="#8f3d2a"/>
        <polygon points="0,700 700,120 740,170 640,430 500,560 360,640 260,700" fill="#a7472f"/>
        <polygon points="672,152 700,120 728,152 736,184 664,184" fill="#d9b48c"/>
        ${segs}
        <g class="dust" transform="translate(400 400)"><circle cx="-30" cy="0" r="18" fill="#e6c9a0"/><circle cx="10" cy="-14" r="24" fill="#e6c9a0"/><circle cx="40" cy="4" r="16" fill="#e6c9a0"/></g>
        <line x1="700" y1="120" x2="700" y2="62" stroke="#fff8e6" stroke-width="5"/><polygon points="700,62 748,78 700,94" fill="#ffd98a"/>
        <g id="hiker" style="transform:translate(${P[0][0]}px, ${P[0][1]}px)"><g transform="translate(0,-54) scale(1.7)">
          <ellipse cx="0" cy="36" rx="18" ry="5" fill="rgba(0,0,0,.35)"/>
          <rect x="-10" y="10" width="8" height="24" rx="3" fill="#c9a27e"/><rect x="2" y="10" width="8" height="24" rx="3" fill="#c9a27e"/>
          <rect x="-13" y="34" width="11" height="6" rx="2" fill="#333"/><rect x="2" y="34" width="11" height="6" rx="2" fill="#333"/>
          <rect x="-15" y="-16" width="30" height="30" rx="7" fill="#e0483c"/>${flowers}
          <rect x="10" y="-14" width="11" height="24" rx="3" fill="#2e6f9e"/>
          <circle cx="0" cy="-28" r="12" fill="#e7b48c"/><path d="M-14 -32 h28 l-5 -7 h-18 z" fill="#3a3a3a"/><rect x="-16" y="-33" width="32" height="4" rx="2" fill="#3a3a3a"/>
        </g></g></svg>
        <div class="reveal"><div class="frame"><img src="chuck.jpg" alt=""></div><div class="cap">${MINI_TEXT.climb.reveal}</div></div></div>`;
    },
    init(el, local) { local.n = 0; local.stage = 'climb'; },
    step(el, local) {
      const T = MINI_TEXT.climb, P = this.pts;
      if (local.stage === 'sneeze') {           /* the HORSE SHIT button was pressed */
        local.stage = 'after';
        el.querySelector('.dust').classList.remove('show');
        Sound.chime();
        return { note:T.notes[4], label:T.blessButton, bigNote:true };
      }
      if (local.stage === 'after') local.stage = 'climb';
      local.n++;
      const p = P[local.n];
      el.querySelector('#hiker').style.transform = `translate(${p[0]}px, ${p[1]}px)`;
      el.querySelector(`.trailseg[data-i="${local.n}"]`).classList.add('done');
      Sound.blip();
      if (local.n === 4) {                       /* the sneeze beat, midway up */
        local.stage = 'sneeze';
        el.querySelector('.dust').classList.add('show');
        return { note:T.notes[3], label:T.sneezeButton, bigNote:true };
      }
      if (local.n >= P.length-1) {               /* summit: reveal the photo */
        const c = el.querySelector('.climb'); c.classList.add('revealed'); c.querySelector('.reveal').classList.add('show');
        Sound.fanfare();
        return { note:T.notes[8], done:true };
      }
      const noteIndex = local.n <= 3 ? local.n-1 : local.n;
      return { note:T.notes[noteIndex], label:T.climbButton };
    },
  },

  /* ---- Chapter 6: paper football flick (misses twice, good on the third) ---- */
  kick: {
    actions() { return `<button class="btn big" data-action="flick">${MINI_TEXT.kick.flick}</button><button class="btn primary big continue" data-action="next" hidden>Continue →</button>`; },
    home: [600, 500],
    build() {
      const T = MINI_TEXT.kick;
      return `<div class="kickwrap"><div class="kick"><svg viewBox="0 0 1200 600">
        <defs><linearGradient id="kTable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a2b"/><stop offset="1" stop-color="#5a3a1a"/></linearGradient></defs>
        <rect width="1200" height="600" rx="16" fill="url(#kTable)"/><g stroke="rgba(0,0,0,.18)" stroke-width="6">${[80,160,240,320,400,480].map(y => `<line x1="0" y1="${y}" x2="1200" y2="${y}"/>`).join('')}</g>
        <rect x="592" y="120" width="16" height="200" fill="#f2c14e"/><rect x="470" y="120" width="260" height="14" fill="#f2c14e"/><rect x="470" y="10" width="14" height="124" fill="#f2c14e"/><rect x="716" y="10" width="14" height="124" fill="#f2c14e"/>
        <text x="600" y="380" text-anchor="middle" font-size="34" font-weight="900" fill="rgba(255,255,255,.55)">CARDINAL RED ZONE</text>
        <line class="meter" x1="600" y1="500" x2="600" y2="500" stroke="#fff" stroke-width="6" stroke-dasharray="14 10" opacity=".8"/>
        <g class="football" style="transform:translate(600px,500px)"><polygon points="-34,30 34,30 0,-34" fill="#f5efe0" stroke="#7a5a30" stroke-width="4" stroke-linejoin="round"/><line x1="-10" y1="4" x2="10" y2="4" stroke="#7a5a30" stroke-width="3"/><line x1="-6" y1="-6" x2="6" y2="-6" stroke="#7a5a30" stroke-width="3"/><line x1="-14" y1="14" x2="14" y2="14" stroke="#7a5a30" stroke-width="3"/></g>
        <text class="good-text" x="600" y="330">IT'S GOOD!</text></svg></div>
        <div class="kickside"><div class="kicker">Attempt</div><div class="attempt">1 of 3</div>${polaroid(T.photo, 3, 'sm')}</div></div>`;
    },
    init(el, local, api) {
      const T = MINI_TEXT.kick;
      local.n = 0; local.flying = false; local.drag = null; local.power = 0;
      api.note(T.intro);
      const svg = el.querySelector('.kick svg'), ball = el.querySelector('.football'), meter = el.querySelector('.meter');
      const toSvg = (e) => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
      const setPull = (p) => { local.power = p; ball.style.transform = `translate(600px, ${500 + p * 90}px) scale(${1 + p * .1})`; meter.setAttribute('y2', 500 + p * 90); meter.setAttribute('opacity', p > 0 ? .9 : 0); };
      svg.addEventListener('pointerdown', (e) => { if (local.flying || local.n >= 3) return; local.drag = toSvg(e); svg.setPointerCapture(e.pointerId); });
      svg.addEventListener('pointermove', (e) => { if (!local.drag) return; const q = toSvg(e); setPull(Math.max(0, Math.min(1, (q.y - local.drag.y) / 140))); });
      const release = (e) => { if (!local.drag) return; local.drag = null; if (local.power > .12) this.launch(el, local, api); else setPull(0); };
      svg.addEventListener('pointerup', release); svg.addEventListener('pointercancel', release);
      local.onKey = (k) => {                       /* hold Space to pull back, release to flick */
        if (local.flying || local.n >= 3) return false;
        if (k === ' ' || k === 'Enter') { if (!local.hold) { local.hold = true; local.holdT = performance.now(); const tick = () => { if (!local.hold) return; setPull(Math.min(1, (performance.now() - local.holdT) / 900)); requestAnimationFrame(tick); }; tick(); } return true; }
        return false;
      };
      local.onKeyUp = (k) => { if ((k === ' ' || k === 'Enter') && local.hold) { local.hold = false; this.launch(el, local, api); } };
      local.setPull = setPull;
    },
    launch(el, local, api) {
      const T = MINI_TEXT.kick;
      if (local.flying || local.n >= 3) return;
      local.flying = true; Sound.blip();
      const ball = el.querySelector('.football'), meter = el.querySelector('.meter'); meter.setAttribute('opacity', 0);
      const n = local.n;                           /* 0 wide right, 1 wide left, 2 good */
      const ends = [[980, 60], [220, 60], [600, 40]], ctrl = [[900, 250], [300, 250], [600, 200]];
      const start = [600, 500 + local.power * 90], end = ends[n], c = ctrl[n], t0 = performance.now(), ms = 1000;
      const frame = (now) => {
        const t = Math.min(1, (now - t0) / ms), u = 1 - t;
        const x = u*u*start[0] + 2*u*t*c[0] + t*t*end[0], y = u*u*start[1] + 2*u*t*c[1] + t*t*end[1];
        ball.style.transform = `translate(${x}px, ${y}px) rotate(${t * 720}deg) scale(${1 - t * .55})`;
        if (t < 1) requestAnimationFrame(frame); else this.landed(el, local, api);
      };
      requestAnimationFrame(frame);
    },
    landed(el, local, api) {
      const T = MINI_TEXT.kick;
      local.n++; local.flying = false; local.power = 0;
      el.querySelector('.attempt').textContent = `${Math.min(local.n + 1, 3)} of 3`;
      if (local.n >= 3) {
        el.querySelector('.good-text').classList.add('show'); el.querySelector('.kickside .polaroid').classList.add('show');
        Sound.cheer(); Confetti.burst(150); api.finish(T.attempts[2]);
        el.querySelectorAll('[data-action="flick"]').forEach(b => b.hidden = true);
      } else {
        Sound.wrong(); api.note(T.attempts[local.n - 1]);
        setTimeout(() => { if (local.alive !== false) local.setPull(0); }, 600);
      }
    },
    act(action, btn, el, local, api) { if (action === 'flick' && !local.flying) { local.setPull(.7); setTimeout(() => this.launch(el, local, api), 150); } },
  },
};
